name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGION: us-central1
  SERVICE_NAME: shopmonkey-scheduler
  IMAGE_NAME: us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/shopmonkey-scheduler/shopmonkey-scheduler

jobs:
  test:
    name: Lint + Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest --tb=short

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'e2e/package-lock.json'

      - name: Install Node dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          CI: 'true'
        run: npx playwright test --reporter=line

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.IMAGE_NAME }} --all-tags

      - name: Capture current revision
        id: current
        run: |
          REVISION=$(gcloud run services describe $SERVICE_NAME \
            --region=$REGION \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || echo "")
          echo "revision=$REVISION" >> $GITHUB_OUTPUT

          PREV_IMAGE=$(gcloud run services describe $SERVICE_NAME \
            --region=$REGION \
            --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || echo "")
          PREV_SHA=$(echo "$PREV_IMAGE" | grep -oP '[a-f0-9]{40}$' || echo "")
          echo "prev_sha=$PREV_SHA" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=$REGION \
            --quiet

          # The health gate curls a domain, which resolves to whichever
          # revision currently holds traffic. Recording the revision this
          # deploy created lets the gate prove it probed the NEW code and not
          # a still-serving older one. Best effort: if this comes back empty
          # the gate skips the comparison rather than failing a good deploy.
          NEW_REVISION=$(gcloud run services describe $SERVICE_NAME \
            --region=$REGION \
            --format='value(status.latestCreatedRevisionName)' 2>/dev/null || echo "")
          echo "new_revision=$NEW_REVISION" >> $GITHUB_OUTPUT

      - name: Verify deployment health
        env:
          CURRENT_REVISION: ${{ steps.current.outputs.revision }}
          NEW_REVISION: ${{ steps.deploy.outputs.new_revision }}
          HEALTH_URL: https://scheduler.salmonspeedworx.com/health/ready
        run: |
          # /health proves nothing: it is a static 200 that never touches
          # Sheets or Shopmonkey, so a container that boots without its
          # credentials mounted sails through it. /health/ready performs a real
          # read against each dependency - and the Sheets read is what forces
          # the lazy load of GOOGLE_APPLICATION_CREDENTIALS, so it is the only
          # externally visible signal that the secret is actually readable.
          #
          # Gate on the body, not on the 503. The endpoint 503s if EITHER
          # dependency is unhealthy, and the two deserve different answers:
          # Sheets unhealthy is this revision's problem (its secret, its env)
          # and rolling back fixes it, while Shopmonkey unhealthy is usually
          # Shopmonkey - the previous revision holds the same token and calls
          # the same API, so rolling back would discard a good deploy and fix
          # nothing.
          sleep 10

          ATTEMPTS=6
          INTERVAL=10
          WINDOW=$((ATTEMPTS * INTERVAL))
          BODY=""
          for attempt in $(seq 1 $ATTEMPTS); do
            BODY=$(curl -sS --max-time 45 "$HEALTH_URL" || echo "")
            STATUS=$(printf '%s' "$BODY" | jq -r '.status // empty' 2>/dev/null || echo "")
            SERVED=$(printf '%s' "$BODY" | jq -r '.revision // empty' 2>/dev/null || echo "")
            if [ "$STATUS" = "healthy" ]; then
              # A healthy answer from the PREVIOUS revision is not a pass:
              # traffic migration is not instant and a CDN sits in front, so
              # without this the gate can green-light code it never probed.
              # Skipped when either side is unknown - never fail on ignorance.
              if [ -n "$NEW_REVISION" ] && [ -n "$SERVED" ] && [ "$SERVED" != "$NEW_REVISION" ]; then
                echo "Attempt $attempt/$ATTEMPTS: healthy, but '$SERVED' answered, not '$NEW_REVISION' - still migrating"
              else
                echo "Readiness probe healthy on attempt $attempt/$ATTEMPTS (revision: ${SERVED:-unknown})"
                exit 0
              fi
            fi
            echo "Attempt $attempt/$ATTEMPTS not ready: ${BODY:-<no response>}"
            # Retries, not a single shot: a transient 429 or a cold start must
            # not roll back a healthy deploy. A missing credential never heals.
            if [ "$attempt" -lt "$ATTEMPTS" ]; then sleep "$INTERVAL"; fi
          done

          echo "::group::Final /health/ready body"
          printf '%s\n' "${BODY:-<no response>}"
          echo "::endgroup::"

          field() {
            local value
            value=$(printf '%s' "$BODY" | jq -r "$1 // empty" 2>/dev/null || true)
            if [ -n "$value" ]; then printf '%s' "$value"; else printf '%s' "$2"; fi
          }
          SHEETS=$(field .sheets unreachable)
          SHOPMONKEY=$(field .shopmonkey unreachable)
          SHEETS_DETAIL=$(field .sheets_detail "no detail reported")
          SHOPMONKEY_DETAIL=$(field .shopmonkey_detail "no detail reported")
          SERVED_REVISION=$(field .revision unknown)

          # No parseable body at all means the service did not answer. That is
          # a deploy failure, and the previous revision did answer, so it is
          # also the one case where rolling back is unambiguously right - but
          # say so honestly instead of pinning it on Sheets.
          if [ "$SHEETS" = "unreachable" ] && [ "$SHOPMONKEY" = "unreachable" ]; then
            echo "::error::No readable /health/ready response after ${WINDOW}s - the service is not answering."
          fi

          if [ "$SHEETS" != "healthy" ]; then
            echo "::error::Sheets dependency is '$SHEETS' after ${WINDOW}s: $SHEETS_DETAIL"

            # A rate limit, a 5xx from Google or a slow probe is not this
            # revision's fault, and the previous revision reads the same
            # spreadsheet with the same service account - rolling back cannot
            # fix it and throws away a good deploy. A missing or rejected
            # credential never matches these, so the case this gate exists for
            # still rolls back.
            if printf '%s' "$SHEETS_DETAIL" | grep -qiE '429|rate.?limit|quota|timed out|timeout|HttpError 5[0-9][0-9]|ServiceUnavailable|InternalError'; then
              echo "::error::NOT rolling back: that reads as transient on Google's side, not as a bad revision. Re-run once Sheets recovers."
              echo "ROLLED_BACK=false" >> "$GITHUB_ENV"
              exit 1
            fi

            # ROLLED_BACK is written only once the rollback has actually
            # succeeded. Telling Slack "rolled back" while the broken revision
            # is still serving is worse than saying nothing at all: it reports
            # production as recovered when it is not.
            if [ -z "$CURRENT_REVISION" ]; then
              echo "::error::No previous revision recorded - the bad revision is STILL LIVE. Roll back by hand."
              echo "ROLLED_BACK=false" >> "$GITHUB_ENV"
              exit 1
            fi

            if gcloud run services update-traffic $SERVICE_NAME \
                 --region=$REGION \
                 --to-revisions="$CURRENT_REVISION"=100; then
              echo "Rolled traffic back to $CURRENT_REVISION"
              echo "ROLLED_BACK=true" >> "$GITHUB_ENV"
            else
              echo "::error::Rollback to $CURRENT_REVISION FAILED - the bad revision is STILL LIVE. Intervene now."
              echo "ROLLED_BACK=false" >> "$GITHUB_ENV"
            fi
            exit 1
          fi

          if [ "$SHOPMONKEY" != "healthy" ]; then
            echo "::error::Shopmonkey dependency is '$SHOPMONKEY' after ${WINDOW}s: $SHOPMONKEY_DETAIL"
            echo "::error::NOT rolling back: the previous revision uses the same API and the same token, so a rollback cannot fix an upstream outage. If the detail above says HTTP 401 or 403, the token in this revision is wrong - roll back by hand."
            echo "ROLLED_BACK=false" >> "$GITHUB_ENV"
            exit 1
          fi

          # Both dependencies read healthy, so we are here because the new
          # revision never took traffic within the window. Rolling back to the
          # revision that is already serving would be a no-op dressed up as a
          # recovery.
          echo "::error::Deploy never took traffic: '$SERVED_REVISION' is still serving, expected '$NEW_REVISION'. The new revision was never verified - investigate before re-running."
          echo "ROLLED_BACK=false" >> "$GITHUB_ENV"
          exit 1

      - name: Notify Slack
        if: success()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PREV_SHA: ${{ steps.current.outputs.prev_sha }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "No SLACK_WEBHOOK_URL configured, skipping notification"
            exit 0
          fi

          if [ -n "$PREV_SHA" ] && git cat-file -t "$PREV_SHA" &>/dev/null; then
            COMMITS=$(git log --oneline "$PREV_SHA".."$GITHUB_SHA" --format='• %s (%an)')
            COMMIT_COUNT=$(git rev-list --count "$PREV_SHA".."$GITHUB_SHA")
          else
            COMMITS=$(git log --oneline -10 --format='• %s (%an)')
            COMMIT_COUNT="?"
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="• No code changes (config/dependency update)"
            COMMIT_COUNT="0"
          fi

          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          TIMESTAMP=$(date -u '+%b %d, %Y %H:%M UTC')

          jq -n \
            --arg short_sha "$SHORT_SHA" \
            --arg sha_url "https://github.com/${GITHUB_REPO}/commit/${GITHUB_SHA}" \
            --arg timestamp "$TIMESTAMP" \
            --arg count "$COMMIT_COUNT" \
            --arg actor "$GITHUB_ACTOR" \
            --arg commits "$COMMITS" \
            --arg app_url "https://scheduler.salmonspeedworx.com" \
            --arg run_url "https://github.com/${GITHUB_REPO}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "SSW Scheduler \u2014 Deployed to Production" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": ("*Commit:*\n<" + $sha_url + "|" + $short_sha + ">") },
                    { "type": "mrkdwn", "text": ("*Deployed:*\n" + $timestamp) },
                    { "type": "mrkdwn", "text": ("*Commits:*\n" + $count) },
                    { "type": "mrkdwn", "text": ("*Triggered by:*\n" + $actor) }
                  ]
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": ("*Changes:*\n" + $commits) }
                },
                {
                  "type": "actions",
                  "elements": [
                    { "type": "button", "text": { "type": "plain_text", "text": "Open App" }, "url": $app_url },
                    { "type": "button", "text": { "type": "plain_text", "text": "View Run" }, "url": $run_url }
                  ]
                }
              ]
            }' | curl -sS --fail-with-body -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d @-

      - name: Notify Slack (failure)
        if: failure()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then exit 0; fi
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)

          # ROLLED_BACK is set by the health-check step. Saying "rolled back"
          # when the new revision is still live is worse than saying nothing:
          # it tells whoever reads Slack that production is back to a known
          # good state when it is not.
          case "${ROLLED_BACK:-}" in
            true)  HEADER="SSW Scheduler — Deploy FAILED (rolled back)" ;;
            false) HEADER="SSW Scheduler — Deploy FAILED (NOT rolled back, new revision is live)" ;;
            *)     HEADER="SSW Scheduler — Deploy FAILED" ;;
          esac

          jq -n \
            --arg short_sha "$SHORT_SHA" \
            --arg header "$HEADER" \
            --arg sha_url "https://github.com/${GITHUB_REPO}/commit/${GITHUB_SHA}" \
            --arg actor "$GITHUB_ACTOR" \
            --arg run_url "https://github.com/${GITHUB_REPO}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": $header }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ("*Commit:* <" + $sha_url + "|" + $short_sha + ">\n*Triggered by:* " + $actor + "\n\n<" + $run_url + "|View failed run>")
                  }
                }
              ]
            }' | curl -sS --fail-with-body -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d @-
