name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGION: us-central1
  SERVICE_NAME: shopmonkey-scheduler
  IMAGE_NAME: us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/shopmonkey-scheduler/shopmonkey-scheduler

jobs:
  test:
    name: Lint + Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        run: pytest --tb=short

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'e2e/package-lock.json'

      - name: Install Node dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          CI: 'true'
        run: npx playwright test --reporter=line

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.IMAGE_NAME }} --all-tags

      - name: Capture current revision
        id: current
        run: |
          REVISION=$(gcloud run services describe $SERVICE_NAME \
            --region=$REGION \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || echo "")
          echo "revision=$REVISION" >> $GITHUB_OUTPUT

          PREV_IMAGE=$(gcloud run services describe $SERVICE_NAME \
            --region=$REGION \
            --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || echo "")
          PREV_SHA=$(echo "$PREV_IMAGE" | grep -oP '[a-f0-9]{40}$' || echo "")
          echo "prev_sha=$PREV_SHA" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=$REGION \
            --quiet

      - name: Verify deployment health
        env:
          CURRENT_REVISION: ${{ steps.current.outputs.revision }}
        run: |
          sleep 10
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://scheduler.salmonspeedworx.com/health)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Health check failed (HTTP $HTTP_STATUS) — rolling back"
            if [ -n "$CURRENT_REVISION" ]; then
              gcloud run services update-traffic $SERVICE_NAME \
                --region=$REGION \
                --to-revisions="$CURRENT_REVISION"=100
            fi
            exit 1
          fi
          echo "Health check passed (HTTP $HTTP_STATUS)"

      - name: Notify Slack
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PREV_SHA: ${{ steps.current.outputs.prev_sha }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "No SLACK_WEBHOOK_URL configured, skipping notification"
            exit 0
          fi

          if [ -n "$PREV_SHA" ] && git cat-file -t "$PREV_SHA" &>/dev/null; then
            COMMITS=$(git log --oneline "$PREV_SHA".."$GITHUB_SHA" --format='• %s (%an)')
            COMMIT_COUNT=$(git rev-list --count "$PREV_SHA".."$GITHUB_SHA")
          else
            COMMITS=$(git log --oneline -10 --format='• %s (%an)')
            COMMIT_COUNT="?"
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="• No code changes (config/dependency update)"
            COMMIT_COUNT="0"
          fi

          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          TIMESTAMP=$(date -u '+%b %d, %Y %H:%M UTC')

          jq -n \
            --arg short_sha "$SHORT_SHA" \
            --arg sha_url "https://github.com/${GITHUB_REPO}/commit/${GITHUB_SHA}" \
            --arg timestamp "$TIMESTAMP" \
            --arg count "$COMMIT_COUNT" \
            --arg actor "$GITHUB_ACTOR" \
            --arg commits "$COMMITS" \
            --arg app_url "https://scheduler.salmonspeedworx.com" \
            --arg run_url "https://github.com/${GITHUB_REPO}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "SSW Scheduler \u2014 Deployed to Production" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": ("*Commit:*\n<" + $sha_url + "|" + $short_sha + ">") },
                    { "type": "mrkdwn", "text": ("*Deployed:*\n" + $timestamp) },
                    { "type": "mrkdwn", "text": ("*Commits:*\n" + $count) },
                    { "type": "mrkdwn", "text": ("*Triggered by:*\n" + $actor) }
                  ]
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": ("*Changes:*\n" + $commits) }
                },
                {
                  "type": "actions",
                  "elements": [
                    { "type": "button", "text": { "type": "plain_text", "text": "Open App" }, "url": $app_url },
                    { "type": "button", "text": { "type": "plain_text", "text": "View Run" }, "url": $run_url }
                  ]
                }
              ]
            }' | curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d @-

      - name: Notify Slack (failure)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then exit 0; fi
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)

          jq -n \
            --arg short_sha "$SHORT_SHA" \
            --arg sha_url "https://github.com/${GITHUB_REPO}/commit/${GITHUB_SHA}" \
            --arg actor "$GITHUB_ACTOR" \
            --arg run_url "https://github.com/${GITHUB_REPO}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "SSW Scheduler \u2014 Deploy FAILED (rolled back)" }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ("*Commit:* <" + $sha_url + "|" + $short_sha + ">\n*Triggered by:* " + $actor + "\n\n<" + $run_url + "|View failed run>")
                  }
                }
              ]
            }' | curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d @-
