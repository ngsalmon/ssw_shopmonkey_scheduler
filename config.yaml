# IANA timezone name used to interpret slot times that the widget submits
# (no offset) and to format datetimes sent to Shopmonkey. DST-aware via
# zoneinfo, so May (CDT, -05:00) and January (CST, -06:00) both work without
# manual offset toggles.
timezone: America/Chicago

business_hours:
  monday:
    open: "09:00"
    close: "17:30"
  tuesday:
    open: "09:00"
    close: "17:30"
  wednesday:
    open: "09:00"
    close: "17:30"
  thursday:
    open: "09:00"
    close: "17:30"
  friday:
    open: "09:00"
    close: "17:30"
  saturday: null  # closed
  sunday: null  # closed

# Default slot duration in minutes (used if service doesn't specify)
default_slot_duration_minutes: 60

# Buffer time (in minutes) added to services by department label
# Used for cure time, drying time, etc. without affecting labor/pricing
# Can be overridden per-service with a "buffer:X" label in Shopmonkey
service_buffers:
  Bedliner: 180  # 3 hours cure time

# Temporarily disabled departments (case-insensitive substring match for exceptions)
disabled_departments:
  Detail:
    except:
      - "Headlight Restoration"

# Online booking parity with Shopmonkey's OOTB scheduler. When create_order
# is true, the /book endpoint also creates a repair-order in the named
# workflow column and attaches the service line item (with labors copied
# from the canned service). The appointment is linked via orderId.
online_booking:
  create_order: true
  workflow_status_name: "Scheduled"
  order_status: "Estimate"
  order_color: "blue"
