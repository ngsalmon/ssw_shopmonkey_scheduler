[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_functions = test_*
# By default skip tests marked integration or booking - they hit live APIs
# (Shopmonkey, Google Sheets) and require real credentials. Run them
# explicitly with: pytest -m integration  (or `-m "integration or booking"`).
addopts = -m "not integration and not booking"
markers =
    integration: requires real API credentials
    booking: creates real bookings (use with caution)
